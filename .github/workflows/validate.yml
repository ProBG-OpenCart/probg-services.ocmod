name: Validate ProBG Services

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Validate PHP syntax
        run: find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate OCMOD XML
        run: php -r '$xml=simplexml_load_file("install.xml"); if ($xml===false) { exit(1); }'
      - name: Validate release metadata
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' install.xml | head -n1)
          test -n "$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
